<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor · Mafy</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/styles.css?v=9">
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 28px 20px; display: grid; gap: 18px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .head h1 { font-size: 26px; }
    .state { font-weight: 600; display: flex; gap: 8px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--err); }
    .dot.on { background: var(--live); }
    .video { aspect-ratio: 16 / 9; background: var(--panel); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); display: grid; place-items: center; }
    .video > div, .video iframe { width: 100%; height: 100%; }
    .row { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
    .row h2 { font-size: 17px; margin-bottom: 8px; }
    .voice { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    #speaking { min-height: 1.5em; }
    #unlock {
      position: fixed; inset: 0; background: rgba(0, 0, 0, .94); display: grid; place-items: center; z-index: 10; text-align: center; padding: 20px;
    }
    #unlock div { display: grid; gap: 14px; justify-items: center; max-width: 420px; }
    #unlock .primary { font-size: 18px; padding: 14px 28px; }
  </style>
</head>
<body>
  <div id="unlock">
    <div>
      <h1>Activa el audio</h1>
      <p class="muted">Tu navegador necesita un clic antes de reproducir voz y música. Deja esta pestaña abierta durante tu LIVE.</p>
      <button class="primary" id="unlockBtn">Activar audio</button>
    </div>
  </div>

  <main>
    <div class="head">
      <h1>Reproductor</h1>
      <span class="state"><span class="dot" id="dot"></span><span id="conn">Conectando…</span></span>
    </div>

    <div class="video"><div id="yt"></div></div>
    <p id="now" class="muted">Sin canción.</p>

    <section class="row">
      <h2>Voz del chat</h2>
      <div class="voice">
        <select id="voiceSelect" aria-label="Voz del navegador"></select>
        <button id="testVoice" class="sm">Probar voz</button>
      </div>
      <p class="small muted" style="margin-top:8px">Esta lista aplica a la voz gratuita. Si elegiste una voz natural en el panel, se usa esa.</p>
      <p id="speaking" class="small" style="margin-top:8px"></p>
    </section>
  </main>

  <script src="/overlay.js?v=9"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player = null;
    let ytReady = false;
    let musicVolume = 50;
    let state = { current: null, queue: [], paused: false };
    let loadedId = null;
    const ttsQueue = [];
    let speaking = false;
    const $ = (id) => document.getElementById(id);

    // OBS permite reproducir sin clic; en navegadores normales se pide uno.
    if (window.obsstudio) $('unlock').remove();
    $('unlockBtn').onclick = () => {
      $('unlock').remove();
      speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
      apply();
    };

    // ----- voces del navegador -----
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      const sel = $('voiceSelect');
      const saved = localStorage.getItem('mafy_voice');
      sel.innerHTML = '';
      voices
        .slice()
        .sort((a, b) => (b.lang.startsWith('es') - a.lang.startsWith('es')) || a.name.localeCompare(b.name))
        .forEach((v) => sel.append(new Option(`${v.name} (${v.lang})`, v.name)));
      const fallback = voices.find((v) => v.lang.startsWith('es-MX')) || voices.find((v) => v.lang.startsWith('es'));
      sel.value = saved && voices.some((v) => v.name === saved) ? saved : fallback?.name || '';
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    $('voiceSelect').onchange = (e) => { try { localStorage.setItem('mafy_voice', e.target.value); } catch {} };
    $('testVoice').onclick = () => enqueueTts({ text: 'Hola, así sonará tu chat.', voice: 'browser', rate: 1, volume: 1 });

    // ----- TTS en cola (baja la música mientras habla) -----
    function enqueueTts(msg) {
      if (ttsQueue.length >= 20) ttsQueue.shift();
      ttsQueue.push(msg);
      nextTts();
    }
    function duck(on) {
      if (player && ytReady) player.setVolume(on ? Math.round(musicVolume * 0.3) : musicVolume);
    }
    function nextTts() {
      if (speaking || !ttsQueue.length) return;
      const msg = ttsQueue.shift();
      speaking = true;
      $('speaking').textContent = '🗣️ ' + msg.text;
      duck(true);
      const done = () => {
        speaking = false;
        $('speaking').textContent = '';
        duck(false);
        setTimeout(nextTts, 250);
      };
      if (msg.audio) {
        const a = new Audio('data:audio/mp3;base64,' + msg.audio);
        a.volume = msg.volume;
        a.onended = done;
        a.onerror = done;
        a.play().catch(done);
        return;
      }
      if (!('speechSynthesis' in window)) return done();
      const u = new SpeechSynthesisUtterance(msg.text);
      const v = speechSynthesis.getVoices().find((x) => x.name === $('voiceSelect').value);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-MX'; }
      u.rate = msg.rate;
      u.volume = msg.volume;
      u.onend = done;
      u.onerror = done;
      speechSynthesis.speak(u);
      setTimeout(() => speaking && done(), 30000); // seguro por si el navegador no avisa
    }

    // ----- YouTube -----
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('yt', {
        width: '100%',
        height: '100%',
        playerVars: { autoplay: 1, controls: 1, rel: 0, playsinline: 1 },
        events: {
          onReady: () => { ytReady = true; player.setVolume(musicVolume); apply(); },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED && state.current) conn.send({ type: 'song:ended', songId: state.current.id });
          },
          onError: () => { if (state.current) conn.send({ type: 'song:error', songId: state.current.id }); },
        },
      });
    };

    function apply() {
      const c = state.current;
      $('now').textContent = c ? `🎵 ${c.title} · pedida por ${c.requestedBy.name}` : 'Sin canción.';
      if (!ytReady) return;
      if (!c) {
        if (loadedId) player.stopVideo();
        loadedId = null;
        return;
      }
      if (c.id !== loadedId) {
        loadedId = c.id;
        player.loadVideoById(c.videoId);
      }
      if (state.paused) player.pauseVideo();
      else if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
    }

    const conn = overlayConnect('player', (msg) => {
      if (msg.type === 'hello' || msg.type === 'config') {
        $('dot').classList.add('on');
        $('conn').textContent = 'Conectado';
        musicVolume = Math.round(msg.songsVolume * 100);
        if (ytReady && !speaking) player.setVolume(musicVolume);
      } else if (msg.type === 'songs:state') {
        state = msg;
        apply();
      } else if (msg.type === 'tts') {
        enqueueTts(msg);
      } else if (msg.type === 'invalid-key') {
        $('dot').classList.remove('on');
        $('conn').textContent = 'Link inválido: cópialo de nuevo desde tu panel';
      }
    });
  </script>
</body>
</html>
